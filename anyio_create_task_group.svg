<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="parentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#1158c7"/>
    </linearGradient>

    <linearGradient id="childGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#196127"/>
    </linearGradient>

    <linearGradient id="tgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e40c9"/>
      <stop offset="100%" stop-color="#553098"/>
    </linearGradient>

    <linearGradient id="exitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9e6a03"/>
      <stop offset="100%" stop-color="#7a5100"/>
    </linearGradient>

    <filter id="blueGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bc8cff"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e3b341"/>
    </marker>
    <marker id="arrowGoldUp" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e3b341"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="560" height="500" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle grid -->
  <g opacity="0.035" stroke="#3fb950" stroke-width="1">
    <line x1="0" y1="40"  x2="560" y2="40"/>
    <line x1="0" y1="80"  x2="560" y2="80"/>
    <line x1="0" y1="120" x2="560" y2="120"/>
    <line x1="0" y1="160" x2="560" y2="160"/>
    <line x1="0" y1="200" x2="560" y2="200"/>
    <line x1="0" y1="240" x2="560" y2="240"/>
    <line x1="0" y1="280" x2="560" y2="280"/>
    <line x1="0" y1="320" x2="560" y2="320"/>
    <line x1="0" y1="360" x2="560" y2="360"/>
    <line x1="0" y1="400" x2="560" y2="400"/>
    <line x1="0" y1="440" x2="560" y2="440"/>
  </g>

  <!-- Title -->
  <text x="280" y="32" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700" font-family="'Courier New', monospace" letter-spacing="0.5">anyio.create_task_group() control flow</text>
  <!-- fun easter egg: "taak" nod -->
  <text x="280" y="46" text-anchor="middle" fill="#3d444d" font-size="9" font-family="'Courier New', monospace">(also known as create_taak_group() in Dutch)</text>
  <line x1="20" y1="52" x2="540" y2="52" stroke="#30363d" stroke-width="1"/>

  <!-- ── Parent task box ── -->
  <rect x="195" y="66" width="170" height="54" rx="6" fill="url(#parentGrad)" filter="url(#blueGlow)" opacity="0.95"/>
  <rect x="195" y="66" width="170" height="54" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="280" y="89" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700" font-family="'Courier New', monospace">Parent task</text>
  <text x="280" y="108" text-anchor="middle" fill="#a5d3ff" font-size="10" font-family="'Courier New', monospace">async def main():</text>

  <!-- Arrow down: parent → async with -->
  <line x1="280" y1="120" x2="280" y2="148" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ── async with create_task_group() ── -->
  <rect x="170" y="152" width="220" height="42" rx="6" fill="url(#tgGrad)" filter="url(#purpleGlow)" opacity="0.95"/>
  <rect x="170" y="152" width="220" height="42" rx="6" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="280" y="170" text-anchor="middle" fill="#e5d0ff" font-size="11" font-weight="700" font-family="'Courier New', monospace">async with</text>
  <text x="280" y="186" text-anchor="middle" fill="#d2b0ff" font-size="11" font-family="'Courier New', monospace">create_task_group() as tg</text>

  <!-- Arrow down from TaskGroup to fork -->
  <line x1="280" y1="194" x2="280" y2="228" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- tg.start_soon() label -->
  <rect x="196" y="202" width="167" height="21" rx="4" fill="#0d1117" opacity="0.8"/>
  <text x="280" y="217" text-anchor="middle" fill="#f0883e" font-size="11" font-family="'Courier New', monospace" font-weight="600">tg.start_soon(myfunc)</text>

  <!-- Fork horizontal line -->
  <line x1="120" y1="240" x2="440" y2="240" stroke="#bc8cff" stroke-width="2"/>

  <!-- Left branch: parent continues inside body -->
  <line x1="170" y1="240" x2="170" y2="275" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Right branch: child spawned -->
  <line x1="390" y1="240" x2="390" y2="275" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ── Parent body continues ── -->
  <rect x="74" y="278" width="190" height="52" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="169" y="299" text-anchor="middle" fill="#8b949e" font-size="11" font-family="'Courier New', monospace">Parent body continues</text>
  <text x="169" y="318" text-anchor="middle" fill="#58a6ff" font-size="10" font-family="'Courier New', monospace">(runs concurrently)</text>

  <!-- ── Child task ── -->
  <rect x="296" y="275" width="188" height="58" rx="6" fill="url(#childGrad)" filter="url(#greenGlow)" opacity="0.95"/>
  <rect x="296" y="275" width="188" height="58" rx="6" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="390" y="299" text-anchor="middle" fill="#d2ffd8" font-size="13" font-weight="700" font-family="'Courier New', monospace">Child task</text>
  <text x="390" y="317" text-anchor="middle" fill="#56d364" font-size="11" font-family="'Courier New', monospace">→ myfunc()</text>

  <!-- Both converge down to barrier -->
  <line x1="169" y1="330" x2="169" y2="358" stroke="#58a6ff" stroke-width="2"/>
  <line x1="390" y1="333" x2="390" y2="358" stroke="#3fb950" stroke-width="2"/>
  <line x1="169" y1="358" x2="390" y2="358" stroke="#e3b341" stroke-width="2"/>
  <line x1="280" y1="358" x2="280" y2="375" stroke="#e3b341" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Barrier wait label -->
  <rect x="190" y="337" width="181" height="19" rx="4" fill="#0d1117" opacity="0.85"/>
  <text x="280" y="350" text-anchor="middle" fill="#e3b341" font-size="10" font-family="'Courier New', monospace" font-weight="600">__aexit__ waits for all tasks</text>

  <!-- ── TaskGroup exit / reunion ── -->
  <rect x="170" y="378" width="220" height="42" rx="6" fill="url(#exitGrad)" opacity="0.95"/>
  <rect x="170" y="378" width="220" height="42" rx="6" fill="none" stroke="#e3b341" stroke-width="1.5"/>
  <text x="280" y="396" text-anchor="middle" fill="#ffe08a" font-size="11" font-weight="700" font-family="'Courier New', monospace">TaskGroup exits cleanly</text>
  <text x="280" y="412" text-anchor="middle" fill="#d4a92a" font-size="10" font-family="'Courier New', monospace">all tasks joined ✓</text>

  <!-- Exception propagation note on the side -->
  <line x1="500" y1="240" x2="500" y2="398" stroke="#da3633" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="440" y1="240" x2="500" y2="240" stroke="#da3633" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="440" y1="398" x2="500" y2="398" stroke="#da3633" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGold)"/>
  <rect x="492" y="296" width="12" height="46" rx="2" fill="#0d1117"/>
  <text x="508" y="325" text-anchor="middle" fill="#ff7b72" font-size="9" font-family="'Courier New', monospace" transform="rotate(90 508 325)">exceptions propagate → ExceptionGroup</text>

  <!-- Bottom callout -->
  <rect x="20" y="434" width="520" height="52" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1" opacity="0.9"/>
  <text x="280" y="452" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700" font-family="'Courier New', monospace">✓ structured concurrency — no orphaned tasks</text>
  <line x1="40" y1="459" x2="520" y2="459" stroke="#30363d" stroke-width="1"/>
  <text x="280" y="475" text-anchor="middle" fill="#8b949e" font-size="10" font-family="'Courier New', monospace">cancellation · exception propagation · task supervision included</text>

  <!-- Corner labels -->
  <text x="14" y="494" fill="#30363d" font-size="10" font-family="'Courier New', monospace">anyio</text>
  <text x="493" y="494" fill="#30363d" font-size="10" font-family="'Courier New', monospace">trio/asyncio</text>
</svg>
