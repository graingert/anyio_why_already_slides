<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" width="520" height="290" font-family="'Courier New', monospace">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
    </style>

    <!-- Dark terminal background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Parent task box gradient -->
    <linearGradient id="parentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#1158c7"/>
    </linearGradient>

    <!-- Child task box gradient -->
    <linearGradient id="childGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Glow filter for parent -->
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Glow filter for child -->
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="520" height="290" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#58a6ff" stroke-width="1">
    <line x1="0" y1="40" x2="520" y2="40"/>
    <line x1="0" y1="80" x2="520" y2="80"/>
    <line x1="0" y1="120" x2="520" y2="120"/>
    <line x1="0" y1="160" x2="520" y2="160"/>
    <line x1="0" y1="200" x2="520" y2="200"/>
    <line x1="0" y1="240" x2="520" y2="240"/>
    <line x1="0" y1="280" x2="520" y2="280"/>
  </g>

  <!-- Title -->
  <text x="260" y="34" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700" font-family="'Courier New', monospace" letter-spacing="0.5">asyncio.create_task() control flow</text>
  <line x1="20" y1="44" x2="500" y2="44" stroke="#30363d" stroke-width="1"/>

  <!-- ── Parent task box ── -->
  <rect x="175" y="60" width="170" height="58" rx="6" fill="url(#parentGrad)" filter="url(#blueGlow)" opacity="0.95"/>
  <rect x="175" y="60" width="170" height="58" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="260" y="85" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700" font-family="'Courier New', monospace">Parent</text>
  <text x="260" y="104" text-anchor="middle" fill="#a5d3ff" font-size="12" font-family="'Courier New', monospace">task</text>

  <!-- Arrow down from parent to fork -->
  <line x1="260" y1="118" x2="260" y2="155" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- create_task() label -->
  <rect x="188" y="127" width="145" height="22" rx="4" fill="#0d1117" opacity="0.7"/>
  <text x="260" y="142" text-anchor="middle" fill="#f0883e" font-size="12" font-family="'Courier New', monospace" font-weight="600">create_task()</text>

  <!-- Fork horizontal line -->
  <line x1="155" y1="168" x2="365" y2="168" stroke="#58a6ff" stroke-width="2"/>

  <!-- Left branch down (parent) -->
  <line x1="185" y1="168" x2="185" y2="205" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Right branch down (child) -->
  <line x1="335" y1="168" x2="335" y2="205" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- ── Parent returns box ── -->
  <rect x="105" y="210" width="160" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="185" y="233" text-anchor="middle" fill="#8b949e" font-size="12" font-family="'Courier New', monospace">Parent</text>
  <text x="185" y="252" text-anchor="middle" fill="#3fb950" font-size="12" font-family="'Courier New', monospace" font-weight="600">returns ✓</text>

  <!-- ── Child task box ── -->
  <rect x="255" y="205" width="160" height="58" rx="6" fill="url(#childGrad)" filter="url(#redGlow)" opacity="0.95"/>
  <rect x="255" y="205" width="160" height="58" rx="6" fill="none" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="335" y="230" text-anchor="middle" fill="#ffdcd8" font-size="13" font-weight="700" font-family="'Courier New', monospace">Child</text>
  <text x="335" y="250" text-anchor="middle" fill="#ffb3b0" font-size="10" font-family="'Courier New', monospace">(orphaned, unsupervised)</text>

  <!-- Arrow right from child to myfunc() -->
  <line x1="415" y1="234" x2="460" y2="234" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- myfunc() pill -->
  <rect x="460" y="220" width="44" height="28" rx="14" fill="#21262d" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="482" y="238" text-anchor="middle" fill="#ff6b6b" font-size="9" font-family="'Courier New', monospace" font-weight="600">myfunc</text>

  <!-- Corner decoration -->
  <text x="14" y="284" fill="#30363d" font-size="10" font-family="'Courier New', monospace">asyncio</text>
  <text x="448" y="284" fill="#30363d" font-size="10" font-family="'Courier New', monospace">CPython</text>
</svg>
