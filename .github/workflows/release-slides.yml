name: Slides PDFs

on:
  pull_request:
    paths:
      - "*.md"
      - "*.svg"
      - ".github/workflows/release-slides.yml"
  push:
    branches: [default]
    paths:
      - "*.md"
      - "*.svg"
      - ".github/workflows/release-slides.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate PDFs
        run: |
          npx @marp-team/marp-cli@latest slides.md        --pdf --html
          npx @marp-team/marp-cli@latest slides_40.md     --pdf --html
          npx @marp-team/marp-cli@latest lightning.md     --pdf --html
          npx @marp-team/marp-cli@latest slides_part1.md  --pdf --html
          npx @marp-team/marp-cli@latest slides_part2.md  --pdf --html
          npx @marp-team/marp-cli@latest slides_part3.md  --pdf --html

      - name: Upload PDFs as artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: slides-pdfs-${{ github.sha }}
          path: "*.pdf"
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = '${{ steps.upload.outputs.artifact-url }}';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              '📄 **Slides PDFs generated** for ' + sha,
              '',
              '| File | Description |',
              '|---|---|',
              '| `slides.pdf` | Full talk |',
              '| `slides_40.pdf` | 40-min version |',
              '| `lightning.pdf` | Lightning talk |',
              '| `slides_part1.pdf` | Part 1: asyncio ≠ async/await + Structured Concurrency |',
              '| `slides_part2.pdf` | Part 2: Level-Triggered Cancellation + Shielding |',
              '| `slides_part3.pdf` | Part 3: AnyIO Features + Why You Already Have It |',
              '',
              `[⬇️ Download all PDFs](${artifactUrl})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Create release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y%m%d)
          TAG="slides-${DATE}-${SHORT_SHA}"

          COMMIT_MSG=$(git log -1 --pretty=%s)

          gh release create "${TAG}" \
            --title "Slides ${DATE} (${SHORT_SHA})" \
            --notes "${COMMIT_MSG}" \
            slides.pdf \
            slides_40.pdf \
            lightning.pdf \
            slides_part1.pdf \
            slides_part2.pdf \
            slides_part3.pdf
