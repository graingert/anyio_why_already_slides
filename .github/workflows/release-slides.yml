name: Slides PDFs + PPTX

on:
  pull_request:
    paths:
      - "*.md"
      - "*.svg"
      - ".github/workflows/release-slides.yml"
  push:
    branches: [default]
    paths:
      - "*.md"
      - "*.svg"
      - ".github/workflows/release-slides.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Generate PDFs and PPTX
        run: |
          for deck in slides slides_40 lightning happy_eyeballs slides_part1 slides_part2 slides_part3; do
            npx @marp-team/marp-cli@latest ${deck}.md --pdf  --html
            npx @marp-team/marp-cli@latest ${deck}.md --pptx --html
          done

      - name: Upload PDFs as artifact
        id: upload-pdf
        uses: actions/upload-artifact@v6
        with:
          name: slides-pdfs-${{ github.sha }}
          path: "*.pdf"
          retention-days: 30

      - name: Upload PPTX as artifact
        id: upload-pptx
        uses: actions/upload-artifact@v6
        with:
          name: slides-pptx-${{ github.sha }}
          path: "*.pptx"
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const pdfUrl  = '${{ steps.upload-pdf.outputs.artifact-url }}';
            const pptxUrl = '${{ steps.upload-pptx.outputs.artifact-url }}';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              '📄 **Slides generated** for ' + sha,
              '',
              '| File | Description |',
              '|---|---|',
              '| `slides` | Full talk |',
              '| `slides_40` | 40-min version |',
              '| `lightning` | Lightning talk |',
              '| `happy_eyeballs` | Happy Eyeballs lightning talk |',
              '| `slides_part1` | Part 1: asyncio ≠ async/await + Structured Concurrency |',
              '| `slides_part2` | Part 2: Level-Triggered Cancellation + Shielding |',
              '| `slides_part3` | Part 3: AnyIO Features + Why You Already Have It |',
              '',
              `[⬇️ Download PDFs](${pdfUrl})`,
              `[⬇️ Download PPTX](${pptxUrl})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Create release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATETIME=$(date -u +%Y%m%d-%H%M%S)
          TAG="slides-${DATETIME}-${SHORT_SHA}"

          COMMIT_MSG=$(git log -1 --pretty=%s)

          gh release create "${TAG}" \
            --title "Slides ${DATETIME} (${SHORT_SHA})" \
            --notes "${COMMIT_MSG}" \
            slides.pdf         slides.pptx \
            slides_40.pdf      slides_40.pptx \
            lightning.pdf      lightning.pptx \
            happy_eyeballs.pdf happy_eyeballs.pptx \
            slides_part1.pdf   slides_part1.pptx \
            slides_part2.pdf   slides_part2.pptx \
            slides_part3.pdf   slides_part3.pptx
