<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="'Courier New', monospace">
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#16a34a"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#b45309"/></marker>
    <marker id="arr-muted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#9ca0b0"/></marker>
  </defs>
  <!-- background -->
  <rect width="700" height="340" fill="#eff1f5" rx="12"/>
  <!-- title -->
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">CancelScope(shield=True) -- what happens under cancellation</text>
  <line x1="20" y1="40" x2="680" y2="40" stroke="#16a34a" stroke-width="1" opacity="0.4"/>
  <!-- column headers -->
  <text x="170" y="62" text-anchor="middle" font-size="14" fill="#475569" font-weight="600">what your code sees</text>
  <text x="530" y="62" text-anchor="middle" font-size="14" fill="#475569" font-weight="600">what happens inside the scope</text>
  <!-- divider -->
  <line x1="350" y1="50" x2="350" y2="292" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="350" y="182" text-anchor="middle" font-size="14" fill="#94a3b8" font-weight="700" transform="rotate(-90,350,182)">cancel deferred</text>
  <!-- === LEFT SIDE === -->
  <!-- your code box -->
  <rect x="20" y="78" width="290" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="99" text-anchor="middle" font-size="13" fill="#475569">your code</text>
  <text x="165" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">with CancelScope(shield=True)</text>
  <!-- cancel held label -->
  <text x="165" y="148" text-anchor="middle" font-size="12" fill="#64748b">cancel arrives -- held at scope boundary</text>
  <text x="165" y="166" text-anchor="middle" font-size="12" fill="#b45309" font-weight="600">[DEFERRED, not consumed]</text>
  <!-- down arrow -->
  <line x1="165" y1="176" x2="165" y2="200" stroke="#9ca0b0" stroke-width="2" marker-end="url(#arr-muted)"/>
  <text x="182" y="194" font-size="12" fill="#64748b">scope exits</text>
  <!-- cancel re-raised box -->
  <rect x="25" y="206" width="280" height="52" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="165" y="228" text-anchor="middle" font-size="13" fill="#475569">cancel re-raised reliably</text>
  <text x="165" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">CancelledError [OK]</text>
  <!-- level note -->
  <text x="165" y="274" text-anchor="middle" font-size="12" fill="#64748b">level-triggered: cancel persists</text>
  <text x="165" y="290" text-anchor="middle" font-size="12" fill="#64748b">until scope exits -- always re-raised</text>
  <!-- === RIGHT SIDE === -->
  <!-- inner work box -->
  <rect x="380" y="78" width="290" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="525" y="99" text-anchor="middle" font-size="13" fill="#475569">shielded work [OK]</text>
  <text x="525" y="119" text-anchor="middle" font-size="15" fill="#16a34a" font-weight="600">runs to completion</text>
  <!-- down arrow -->
  <line x1="525" y1="130" x2="525" y2="158" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- result delivered box -->
  <rect x="390" y="164" width="270" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="525" y="185" text-anchor="middle" font-size="13" fill="#475569">result returned to caller</text>
  <text x="525" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">result delivered [OK]</text>
  <!-- notes -->
  <text x="525" y="236" text-anchor="middle" font-size="12" fill="#64748b">cancel cannot interrupt the scope</text>
  <text x="525" y="252" text-anchor="middle" font-size="12" fill="#64748b">cleanup / I/O completes safely</text>
  <!-- bottom summary -->
  <rect x="20" y="280" width="660" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="350" y="300" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="bold">cancel is held outside the scope -- deferred, not consumed</text>
  <text x="350" y="318" text-anchor="middle" font-size="12" fill="#475569">scope runs fully, result is delivered, then cancel is reliably re-raised on exit</text>
</svg>
