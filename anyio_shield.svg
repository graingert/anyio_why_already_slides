<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,monospace">
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#40a02b"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#df8e1d"/></marker>
    <marker id="arr-muted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#9ca0b0"/></marker>
  </defs>
  <!-- background -->
  <rect width="660" height="310" fill="#eff1f5" rx="12"/>
  <!-- title -->
  <text x="330" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#40a02b">CancelScope(shield=True) — what happens under cancellation</text>
  <line x1="16" y1="34" x2="644" y2="34" stroke="#40a02b" stroke-width="1" opacity="0.35"/>
  <!-- column headers -->
  <text x="160" y="54" text-anchor="middle" font-size="11" fill="#6c6f85">what your code sees</text>
  <text x="490" y="54" text-anchor="middle" font-size="11" fill="#6c6f85">what happens inside the scope</text>
  <!-- divider -->
  <line x1="330" y1="44" x2="330" y2="290" stroke="#8c8fa1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="330" y="174" text-anchor="middle" font-size="18" fill="#8c8fa1" transform="rotate(-90,330,174)">cancel deferred</text>
  <!-- === LEFT SIDE === -->
  <!-- your code box -->
  <rect x="30" y="66" width="200" height="44" rx="5" fill="#dce0e8" stroke="#1e66f5" stroke-width="1.5"/>
  <text x="130" y="84" text-anchor="middle" font-size="11" fill="#6c6f85">your code</text>
  <text x="130" y="101" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e66f5">with CancelScope(shield=True)</text>
  <!-- cancel held label -->
  <text x="130" y="128" text-anchor="middle" font-size="10" fill="#6c6f85">cancel arrives — held at scope boundary</text>
  <text x="130" y="142" text-anchor="middle" font-size="10" fill="#df8e1d">⏸ deferred, NOT consumed</text>
  <!-- down arrow -->
  <line x1="130" y1="152" x2="130" y2="175" stroke="#9ca0b0" stroke-width="1.5" marker-end="url(#arr-muted)"/>
  <text x="142" y="168" font-size="10" fill="#6c6f85">scope exits</text>
  <!-- cancel re-raised box -->
  <rect x="20" y="178" width="220" height="44" rx="5" fill="#fef0cd" stroke="#df8e1d" stroke-width="2"/>
  <text x="130" y="196" text-anchor="middle" font-size="11" fill="#6c6f85">cancel re-raised reliably</text>
  <text x="130" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#df8e1d">CancelledError ✓</text>
  <!-- level note -->
  <text x="130" y="240" text-anchor="middle" font-size="10" fill="#6c6f85">level-triggered: cancel persists</text>
  <text x="130" y="254" text-anchor="middle" font-size="10" fill="#6c6f85">until scope exits — always re-raised</text>
  <!-- === RIGHT SIDE === -->
  <!-- inner work box -->
  <rect x="350" y="66" width="270" height="44" rx="5" fill="#cff0d8" stroke="#40a02b" stroke-width="1.5"/>
  <text x="485" y="84" text-anchor="middle" font-size="11" fill="#6c6f85">shielded work  ✓</text>
  <text x="485" y="101" text-anchor="middle" font-size="12" fill="#40a02b">runs to completion</text>
  <!-- down arrow -->
  <line x1="485" y1="110" x2="485" y2="138" stroke="#40a02b" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <!-- result delivered box -->
  <rect x="360" y="140" width="250" height="44" rx="5" fill="#cff0d8" stroke="#40a02b" stroke-width="2"/>
  <text x="485" y="158" text-anchor="middle" font-size="11" fill="#6c6f85">result returned to caller</text>
  <text x="485" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#40a02b">result delivered ✓</text>
  <!-- notes -->
  <text x="485" y="208" text-anchor="middle" font-size="10" fill="#6c6f85">cancel cannot interrupt the scope</text>
  <text x="485" y="222" text-anchor="middle" font-size="10" fill="#6c6f85">cleanup / I/O completes safely</text>
  <!-- bottom summary -->
  <rect x="16" y="248" width="628" height="48" rx="6" fill="#e6e9ef" stroke="#8c8fa1" stroke-width="1"/>
  <text x="330" y="266" text-anchor="middle" font-size="11" fill="#40a02b" font-weight="bold">cancel is held outside the scope — deferred, not consumed</text>
  <text x="330" y="285" text-anchor="middle" font-size="10" fill="#6c6f85">scope runs fully, result is delivered, then cancel is reliably re-raised on exit</text>
</svg>
